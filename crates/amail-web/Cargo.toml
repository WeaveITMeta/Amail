# =============================================================================
# AMAIL-WEB - Leptos Web Dashboard for Amail
# =============================================================================
# Table of Contents:
# 1. Package Metadata
# 2. Dependencies (Leptos, WebSocket, Serialization)
# 3. Build Configuration
# =============================================================================

[package]
name = "amail-web"
version = "0.1.0"
edition = "2021"
description = "Amail web dashboard using Leptos + Trunk"

# Standalone crate - not part of main workspace (targets wasm32)
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos framework
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }

# WebSocket and HTTP client
gloo-net = { version = "0.6", features = ["websocket", "http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
] }

# Logging
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"

# Time
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
