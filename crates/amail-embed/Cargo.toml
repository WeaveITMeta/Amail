# =============================================================================
# AMAIL-EMBED - Embeddable Leptos Components for External Apps
# =============================================================================
# Table of Contents:
# 1. Package Metadata
# 2. Dependencies
# 3. Features
# =============================================================================

[package]
name = "amail-embed"
version = "0.1.0"
edition = "2021"
description = "Embeddable Amail components for Leptos applications"
license = "MIT"
repository = "https://github.com/your-repo/amail"
keywords = ["email", "ai", "leptos", "embed", "widget"]
categories = ["web-programming", "gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CustomEvent",
    "CustomEventInit",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.5"
gloo-timers = "0.3"

[features]
default = ["inbox-widget", "contact-form", "status-badge"]
inbox-widget = []
contact-form = []
status-badge = []
full = ["inbox-widget", "contact-form", "status-badge"]
